name: update

# The hourly data pipeline. Everything feeds one file: data/stations.json (the site database).
#
# Gatherers (each uploads an artifact; a failure in one never blocks the others):
#   mika            - Mika's station pages: operator prices, the 98 flag, the logo brand,
#                     the Shabbat hours
#   violations      - the Ministry's substandard-fuel list, by licence
#   pricecheck      - Waze's reported 98 price for every collected venue (Israeli runner)
#   paz/sonol/doralon/delek - the operator's own station list + its updater
#   ten             - Ten's station list (no 98 anywhere)
# commit            - folds all artifacts into data/stations.json with poc/build_stations.py,
#                     publishes it with poc/publish_site.py, and commits it plus
#                     data/violations.json. Pages serves the new file with no deploy.
# The commit job runs `if: always()`, so one broken gatherer costs that source's refresh, not
# the whole run; prices with no fresh report carry the previous value over.

on:
  # No `push` trigger on purpose: the commit job commits data/stations.json and
  # data/violations.json, and a push-triggered run would chase its own commits.
  schedule:
    - cron: '15 * * * *'              # hourly at :15 - GitHub's scheduler is best-effort: a 2-hourly
                                      # cron was delivering runs 30-60 min late and 4-5 h apart, and each
                                      # attempt may land in a cold window, so try every hour
    - cron: '45 2 * * *'              # 05:45 Israel time - fuel-quality flags (violations job)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prices

jobs:
  # ─────────────────────────────────────────────────────────────────────────── gatherers ──
  mika:
    # Mika's station pages: one scrape yields the operator's own prices, the 98 flag, the brand
    # logo and the Shabbat hours, so there is a single step (mika_update.py). ubuntu-latest is fine
    # - mika.org.il serves everyone (the pin in price-ci/mika_chain.pem covers the broken
    # intermediate it started sending on 2026-11-17).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Mika's street join uses the Ministry registry, and some Mika pages resolve their pin from a
      # cached map link. Both are cacheable; losing the registry only weakens one join pass, it does
      # not fail the run.
      - name: Cache the Ministry registry + Mika map markers
        uses: actions/cache@v4
        with:
          path: |
            price-ci/registry_cache.json
            price-ci/mika_navpoints_cache.json
          key: mika-caches-${{ runner.os }}-${{ github.run_id }}
          restore-keys: mika-caches-${{ runner.os }}-

      - name: Mika - station-page flags (brand, 98, Shabbat)
        run: |
          set +e
          python3 poc/mika_update.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::mika_update.py failed (exit $code) - the commit carries the previous Mika matches"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mika-matches
          path: |
            poc/mika_matches.json
            poc/mika_update.json

  violations:
    # The Ministry's API is geo-restricted, so the check runs from Israel - which is what the
    # self-hosted runner is for. Committing is the commit job's business (the IL runner's `git` is
    # the CommandLineTools shim, which an x86_64 runner on Apple Silicon cannot execute).
    runs-on: ${{ fromJSON(vars.WAZE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Where does this runner egress from?
        run: |
          country=$(curl -s -m 20 https://ifconfig.co/country-iso || echo '?')
          echo "egress country: $country"
          if [ "$country" != "IL" ]; then
            echo "::error::the Ministry fuel-quality API answers only Israeli IPs - this runner is $country"
            exit 1
          fi

      - name: Tools on this runner
        run: |
          NODE=""
          for c in "$(command -v node 2>/dev/null)" /opt/homebrew/bin/node /usr/local/bin/node node; do
            [ -n "$c" ] || continue
            if "$c" --version >/dev/null 2>&1; then NODE="$c"; break; fi
          done
          if [ -z "$NODE" ]; then echo "::error::no working node on this runner (brew install node)"; exit 1; fi
          echo "NODE=$NODE" >> "$GITHUB_ENV"
          echo "node: $NODE ($("$NODE" --version))"

      - name: Check the Ministry's substandard-fuel list against our stations
        run: '"$NODE" scripts/check-violations.mjs'

      # the licence list is what stations.json marks by ministry_id (works for stations that are
      # not one of our 326 live venues)
      - name: Violation licences
        run: '"$NODE" poc/violation_licences.js'

      - uses: actions/upload-artifact@v4
        with:
          name: violations
          path: |
            data/violations.json
            poc/violation_licences.json

  # ────────────────────────────────────────────────────────────────────────────── commit ──
  # ─────────────────────────────────────────────── station-database gatherers (brand sites + Waze) ──
  # Each brand job fetches the operator's own station list, runs its updater and uploads the
  # matches; the commit job folds them into data/stations.json - the site's single database.
  pricecheck:
    # Waze only answers with prices to an IL frontend, so this job uses the Israeli runner.
    runs-on: ${{ fromJSON(vars.WAZE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    env:
      WAZE_SESSION_COOKIE: '${{ vars.WAZE_SESSION_COOKIE }}'
    steps:
      - uses: actions/checkout@v4
      - name: Tools on this runner
        run: |
          echo "host: $(uname -srm)"
          PY=""
          for c in "$(command -v python3 2>/dev/null)" /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3 python3; do
            [ -n "$c" ] || continue
            if "$c" -c 'import sys; assert sys.version_info >= (3, 10)' 2>/dev/null; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "::error::no working python3 >= 3.10 on this runner"
            exit 1
          fi
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          echo "python: $PY ($("$PY" --version 2>&1))"
      - name: Price-check every collected venue
        run: $PYTHON poc/price_check_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricecheck
          path: poc/price_check.jsonl

  paz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Browser tools
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch the Paz station list (retry; the committed list is the fallback)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            node poc/fetch_official.js paz && break
            sleep 20
          done
      - run: python3 poc/paz_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: paz, path: poc/paz_matches.json }

  sonol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Browser tools
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch the Sonol station list (retry; the committed list is the fallback)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            node poc/fetch_official.js sonol && break
            sleep 20
          done
      - run: python3 poc/sonol_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonol
          path: |
            poc/sonol_matches.json
            poc/sonol_unmatched.json

  doralon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Browser tools
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch the Dor Alon station list (retry; the committed list is the fallback)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            node poc/fetch_official.js doralon && break
            sleep 20
          done
      - run: python3 poc/doralon_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doralon
          path: |
            poc/doralon_matches.json
            poc/doralon_unmatched.json

  delek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Browser tools
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch the Delek station list (retry; the committed list is the fallback)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            node poc/fetch_official.js delek && break
            sleep 20
          done
      - run: python3 poc/delek_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delek
          path: |
            poc/delek_matches.json
            poc/delek_unmatched.json

  ten:
    # Ten's API answers with a 403 from GitHub-hosted runners (geo/IP filtered), so this job runs
    # on the Israeli runner like the Waze checks.
    runs-on: ${{ fromJSON(vars.WAZE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools on this runner
        run: |
          echo "host: $(uname -srm)"
          PY=""
          for c in "$(command -v python3 2>/dev/null)" /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3 python3; do
            [ -n "$c" ] || continue
            if "$c" -c 'import sys; assert sys.version_info >= (3, 10)' 2>/dev/null; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "::error::no working python3 >= 3.10 on this runner"
            exit 1
          fi
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          echo "python: $PY ($("$PY" --version 2>&1))"
      - name: Fetch Ten's station list (the committed list is the fallback)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            $PYTHON poc/fetch_ten.py && break
            sleep 20
          done
      - run: $PYTHON poc/ten_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten
          path: |
            poc/ten_matches.json
            poc/ten_unmatched.json

  commit:
    needs: [mika, violations, pricecheck, paz, sonol, doralon, delek, ten]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Station-database inputs: the brand jobs' matches + the Waze price check run by the
      # pricecheck job. A missing artifact is fine - the builder carries the previous values.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: violations
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '{paz,sonol,doralon,delek,ten,pricecheck,mika-matches}'
          path: poc
          merge-multiple: true

      # build_stations needs the Ministry registry, which is a gitignored cache in the repo:
      # fetch it here from data.gov.il (the same loader Mika uses, which writes the cache).
      - name: Ministry registry for the station database
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'price-ci')
          import mika_prices
          rows = mika_prices.load_registry()
          print(f'registry rows: {len(rows)}')
          PY

      - name: Build data/stations.json (the site database)
        continue-on-error: true
        run: |
          python3 poc/build_stations.py
          python3 poc/publish_site.py

      - name: Commit
        run: |
          git config user.name  'price-check[bot]'
          git config user.email '107122576+price-check-bot@users.noreply.github.com'
          git add data/stations.json data/violations.json
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          MSG="data: refresh the stations database [skip ci]"
          BODY="$(python3 -c "import json;d=json.load(open('data/stations.json'));print(f\"{len(d)} stations, {sum(1 for r in d if r['got98'])} sell 98, {sum(1 for r in d if r['price'] is not None)} priced, {sum(1 for r in d if r['shabbat_closure'])} Shabbat-closed\")")"
          git commit -m "$MSG" -m "$BODY"
          # a push during the run can move main under us: rebase and retry; if a data file
          # conflicts, merge preferring the freshly built files (they are the newer truth)
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main 2>/dev/null; then
              if git push 2>/dev/null; then exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
              if git merge --no-edit -X ours origin/main 2>/dev/null; then
                if git push 2>/dev/null; then exit 0; fi
              else
                git merge --abort 2>/dev/null || true
              fi
            fi
            sleep 5
          done
          echo "::error::could not push the data commit - leaving it for the next run"
          exit 1
