<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let stations = [];
let flagged = new Map();   // "brand|name" -> Ministry substandard-fuel info
let userLat = null, userLon = null;
let currentView = 'table';
let currentBrand = 'all';
let map = null, markers = [], userMarker = null;

// Remap brand names for display
function displayBrand(brand) {
  if (brand === 'דורלון') return 'דור אלון';
  return brand;
}

function brandClass(brand) {
  if (brand === 'דורלון') return 'דור-אלון';
  return brand;
}

// Fuel-quality flag — stations on the Ministry of Energy substandard-fuel list
function flagBadge(s) {
  let out = '';
  if (s.shabbat_closure) {
    out += ' <span class="shabbat-flag" role="button" tabindex="0" aria-label="תחנה שומרת שבת"' +
           ' onclick="toggleShabbatTip(event, this)">✡<span class="shabbat-tip" role="tooltip">' +
           'תחנה שומרת שבת</span></span>';
  }
  const v = flagged.get(s.brand + '|' + s.name);
  if (v) {
    const t = 'דווח על דלק לא תקני (' + v.fuelType + ') — נדגם ' + v.samplingDate + ' · משרד האנרגיה';
    out += ' <span class="fuel-flag" title="' + t + '">⚠️</span>';
  }
  return out;
}

// 98 prices, published by the price pipeline as
// { "<waze_id>|<pin:lat,lon>": { "98": 8.59, "reported_at": "2026-10-28T05:00:00Z" } }.
// The station data already carries the identity, so the join is a lookup - never a distance
// calculation. Pins are matched on 6 decimals so a float that stringifies differently
// ("31.986506" vs "31.986506000000002") cannot silently detach a price from its station.
var prices = {};
// Timestamp of the published price file ("generated"); the fallback for the report-date tooltip.
var pricesGenerated = null;
// The publisher's key is canonical at 6 decimals; the unrounded form is accepted too so a file
// written before that was normalised still resolves.
function pinKeys(lat, lon) {
  return ['pin:' + Number(lat).toFixed(6) + ',' + Number(lon).toFixed(6),
          'pin:' + Number(lat) + ',' + Number(lon)];
}
function priceRecord(s) {
  if (!s.coordinates) return null;
  if (s.waze_id && prices[s.waze_id]) return prices[s.waze_id];
  var keys = pinKeys(s.coordinates.lat, s.coordinates.lon);
  for (var i = 0; i < keys.length; i++) if (prices[keys[i]]) return prices[keys[i]];
  return null;
}
function priceOf(s) {
  var rec = priceRecord(s);
  if (!rec) return null;
  var v = (rec['98'] != null) ? rec['98'] : (typeof rec === 'number' ? rec : null);
  return (typeof v === 'number' && isFinite(v)) ? v : null;
}
// The publisher writes `reported_at` per station: Waze's report time, or the Mika scrape date.
// Older files have no per-station date, so fall back to the file's `generated` timestamp.
function fmtDate(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var p = function(n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
}
function priceBubble(s) {
  var p = priceOf(s);
  if (p === null) return '';
  var rec = priceRecord(s);
  var when = (rec && (rec.reported_at || rec.updated)) || pricesGenerated || '';
  var dm = fmtDate(when);
  var tip = dm
    ? '<span class="price-tip" role="tooltip">תאריך דיווח: ' + dm + '</span>'
    : '';
  return '<span class="price-bubble' + (tip ? ' has-tip' : '') + '"' +
         (tip ? ' tabindex="0" role="button" aria-label="מחיר 98 — הצג תאריך דיווח"' : '') +
         (tip ? ' onclick="togglePriceTip(event, this)"' : '') +
         ' title="מחיר 98 אחרון שדווח (₪ לליטר)">' +
         '<span class="cur">₪</span>' + p.toFixed(2) + tip + '</span>';
}
// Toggle the report-date tooltip; stopPropagation keeps a click inside a map popup from closing it.
function toggleShabbatTip(e, el) {
  if (e) e.stopPropagation();
  var wasOpen = el.classList.contains('open');
  document.querySelectorAll('.shabbat-flag.open').forEach(function(b) { b.classList.remove('open'); });
  if (!wasOpen) el.classList.add('open');
}

function togglePriceTip(e, el) {
  if (e) e.stopPropagation();
  var wasOpen = el.classList.contains('open');
  document.querySelectorAll('.price-bubble.open').forEach(function(b) { b.classList.remove('open'); });
  if (!wasOpen) el.classList.add('open');
}

// Single source of truth: ci_update/stations.json (the automations rebuild it; prices and flags
// live on each row, so there is no manifest / brand files / prices.json / violations.json join).
fetch('ci_update/stations.json')
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    stations = rows.filter(function(r) {
      return r.got98 && r.listed !== false && r.lattiude != null && r.longtitude != null;
    }).map(function(r) {
      return {
        brand: r.brand, name: r.station_name, ministry_id: r.ministry_id,
        coordinates: { lat: r.lattiude, lon: r.longtitude },
        waze_id: r.waze_id || null, google_id: r.google_id || null,
        shabbat_closure: !!r.shabbat_closure, violation: !!r.violation,
        price: r.price, price_reported: r.price_reported,
        violation_fuel: r.violation_fuel, violation_sampling: r.violation_sampling
      };
    });
    stations.forEach(function(s) {
      if (s.price != null) {
        var rec = { '98': s.price, reported_at: s.price_reported };
        if (s.waze_id) prices[s.waze_id] = rec;
        pinKeys(s.coordinates.lat, s.coordinates.lon).forEach(function(k) { prices[k] = rec; });
      }
      if (s.violation) {
        flagged.set(s.brand + '|' + s.name, {
          fuelType: s.violation_fuel || '', samplingDate: s.violation_sampling || ''
        });
      }
    });
    buildCityIndex();
    // honor a ?q= search term (shareable search links + JSON-LD SearchAction)
    var q = new URLSearchParams(location.search).get('q');
    if (q) { document.getElementById('searchInput').value = q; render(); }
  });

// requestLocation is handled inline in the locate button click handler
// to ensure Safari iOS recognizes the user gesture context

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-popup';
  div.innerHTML = `<span class="close-btn" onclick="this.parentElement.remove()">&#10005;</span><span>${msg}</span>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 6000);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// City lookup for search — the city isn't in the station data, it lives only in
// the <noscript> SEO block: <h3>תחנות דלק 98 ב{city}</h3><ul><li>{brand} — {name}</li>…
var cityByKey = {};
function buildCityIndex() {
  var ns = document.querySelector('noscript');
  if (!ns) return;
  var doc = new DOMParser().parseFromString(ns.textContent, 'text/html');
  var pfx = 'תחנות דלק 98 ב';
  doc.querySelectorAll('h3').forEach(function(h3) {
    var t = (h3.textContent || '').trim();
    if (t.indexOf(pfx) !== 0) return;            // skip the "נוספות" (no-city) section
    var city = t.slice(pfx.length);
    var ul = h3.nextElementSibling;
    if (!ul || ul.tagName !== 'UL') return;
    ul.querySelectorAll('li').forEach(function(li) {
      cityByKey[(li.textContent || '').trim()] = city;
    });
  });
}

function getFiltered() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = [...stations];
  if (currentBrand !== 'all') list = list.filter(s => s.brand === currentBrand);
  if (query) list = list.filter(s =>
    s.name.toLowerCase().includes(query) ||
    displayBrand(s.brand).toLowerCase().includes(query) ||
    s.brand.toLowerCase().includes(query) ||
    (cityByKey[displayBrand(s.brand) + ' — ' + s.name] || '').toLowerCase().includes(query)
  );
  if (userLat !== null) {
    list.forEach(s => { s._dist = haversine(userLat, userLon, s.coordinates.lat, s.coordinates.lon); });
    list.sort((a, b) => a._dist - b._dist);
  }
  return list;
}

function formatDist(km) {
  if (km < 1) return `${Math.round(km * 1000)} מ'`;
  return `${km.toFixed(1)} ק"מ`;
}

// Navigation target: the Waze venue when we know its id — Waze then routes to its own entrance
// and the link survives the venue being moved/redrawn. Without an id we navigate to our own
// coordinate pin (a dropped pin), which is acceptable: the pin is venue-verified.
function wazeUrl(s) {
  const { lat, lon } = s.coordinates;
  const ll = `ll=${lat},${lon}`;
  return s.waze_id
    ? `https://waze.com/ul?to=place.${encodeURIComponent(s.waze_id)}&${ll}&navigate=yes`
    : `https://waze.com/ul?${ll}&navigate=yes`;
}

// GoatCounter events: one path per station so clicks can be counted per station. The path is the
// event name and must not start with '/', hence the `waze-` prefix; `waze_id` is unique, and the
// coordinate pin is the fallback for the stations without a venue id.
const escAttr = v => String(v).replace(/[&<>"']/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
function wazeEventAttrs(s) {
  const id = s.waze_id || `pin-${s.coordinates.lat}-${s.coordinates.lon}`;
  return `data-goatcounter-click="waze-${escAttr(id)}"` +
         ` data-goatcounter-title="${escAttr(s.brand + ' ' + s.name)}"` +
         ' data-goatcounter-no-session="1"';
}
function bindCounter() {
  if (window.goatcounter && typeof goatcounter.bind_events === 'function') goatcounter.bind_events();
}

function render() {
  const list = getFiltered();
  if (currentView === 'table') renderTable(list);
  if (currentView === 'map') renderMap(list);
  bindCounter();
}

function renderTable(list) {
  const shown = list.slice(0, userLat !== null ? 10 : list.length);
  const container = document.getElementById('tableView');

  if (shown.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#128531;</div>לא נמצאו תחנות</div>';
    return;
  }

  // Mobile cards
  let cards = '';
  shown.forEach((s, i) => {
    const brand = displayBrand(s.brand);
    cards += `
    <div class="station-card">
      <div class="station-rank">${i + 1}</div>
      <div class="station-info">
        <div class="station-name">${s.name}${flagBadge(s)}</div>
        <div class="station-meta">
          <span class="brand-tag brand-${brandClass(s.brand)}">${brand}</span>
          ${s._dist != null ? `<span class="distance">${formatDist(s._dist)}</span>` : ''}
        </div>
      </div>
      ${priceBubble(s)}
      <a class="waze-btn" href="${wazeUrl(s)}" target="_blank" title="נווט ב-Waze" ${wazeEventAttrs(s)}><img src="${WAZE_ICON_WHITE}" alt="Waze"></a>
    </div>`;
  });

  // Desktop table
  let table = `<table class="station-table">
    <thead><tr>
      <th>#</th><th>תחנה</th><th>חברה</th>
      ${userLat !== null ? '<th>מרחק</th>' : ''}
      <th>מחיר</th>
      <th>ניווט</th>
    </tr></thead><tbody>`;
  shown.forEach((s, i) => {
    const brand = displayBrand(s.brand);
    table += `<tr>
      <td>${i + 1}</td>
      <td>${s.name}${flagBadge(s)}</td>
      <td><span class="brand-tag brand-${brandClass(s.brand)}">${brand}</span></td>
      ${userLat !== null ? `<td class="distance">${formatDist(s._dist)}</td>` : ''}
      <td class="price-cell">${priceBubble(s) || '<span class="price-none">—</span>'}</td>
      <td><a class="waze-link" href="${wazeUrl(s)}" target="_blank" ${wazeEventAttrs(s)}><img src="${WAZE_ICON_BLUE}" alt="Waze"> Waze</a></td>
    </tr>`;
  });
  table += '</tbody></table>';

  container.innerHTML = cards + table;
}

// Map
const brandColors = {
  'פז': '#f9a825', 'דורלון': '#2e7d32', 'סונול': '#d32f2f', 'מיקה': '#d500f9',
  'דלק': '#1565c0', 'תפוז': '#ef6c00', 'אחר': '#616161'
};

function renderMap(list) {
  const mapEl = document.getElementById('map');
  mapEl.style.display = 'block';
  document.getElementById('tableView').style.display = 'none';

  if (!map) {
    const center = userLat !== null ? [userLat, userLon] : [31.8, 34.8];
    map = L.map('map', { zoomControl: false }).setView(center, userLat !== null ? 12 : 8);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    if (userLat !== null) {
      const arrowIcon = L.divIcon({
        className: '',
        html: `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15" fill="rgba(66,133,244,.15)" stroke="rgba(66,133,244,.3)" stroke-width="1"/>
          <path d="M16 6 L22 22 L16 18 L10 22 Z" fill="#4285f4" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });
      userMarker = L.marker([userLat, userLon], { icon: arrowIcon, zIndexOffset: 1000 })
        .addTo(map).bindPopup('המיקום שלך');
    }
  }

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  list.forEach(s => {
    const color = brandColors[s.brand] || '#666';
    const brand = displayBrand(s.brand);
    const marker = L.circleMarker([s.coordinates.lat, s.coordinates.lon], {
      radius: 8, fillColor: color, fillOpacity: .9, color: '#fff', weight: 2
    }).addTo(map);

    const distStr = s._dist ? `<br><span style="color:#888">${formatDist(s._dist)}</span>` : '';
    marker.bindPopup(`
      <div style="text-align:right;font-size:14px;min-width:140px">
        <b>${s.name}${flagBadge(s)}</b><br>
        <span style="display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap">
          <span class="brand-tag brand-${brandClass(s.brand)}" style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px">${brand}</span>
          ${priceBubble(s)}
        </span>
        ${distStr}
        <br><a href="${wazeUrl(s)}" target="_blank" ${wazeEventAttrs(s)}
          style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:6px 14px;background:#1a1a2e;color:#fff;border-radius:6px;text-decoration:none;font-size:13px">
          <img src="${WAZE_ICON_WHITE}" width="16" height="16" alt=""> נווט ב-Waze</a>
      </div>
    `);
    marker.on('popupopen', bindCounter);
    markers.push(marker);
  });

  if (userLat !== null) {
    map.setView([userLat, userLon], 13);
  } else if (markers.length > 0) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.1));
  }

  setTimeout(() => map.invalidateSize(), 100);
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    if (currentView === 'table') {
      document.getElementById('map').style.display = 'none';
      document.getElementById('tableView').style.display = 'block';
    }
    render();
  });
});

// Brand filters
document.querySelectorAll('.brand-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBrand = btn.dataset.brand;
    render();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', () => render());

// Manual city/address locate — resolved from our own data, no geocoding service.
// Cities come from the SEO block index (buildCityIndex); a match on station name or
// brand works too. The location is the centroid of the matching stations, which is
// exactly the area the user is about to see anyway.
function centroidOf(list) {
  var lat = 0, lon = 0;
  list.forEach(function(s) { lat += s.coordinates.lat; lon += s.coordinates.lon; });
  return [lat / list.length, lon / list.length];
}
function resolveLocally(q) {
  var needle = q.toLowerCase();
  var byCity = stations.filter(function(s) {
    var c = cityByKey[displayBrand(s.brand) + ' — ' + s.name];
    return c && c.toLowerCase().indexOf(needle) !== -1;
  });
  if (byCity.length) return centroidOf(byCity);
  var byText = stations.filter(function(s) {
    return s.name.toLowerCase().indexOf(needle) !== -1 ||
           displayBrand(s.brand).toLowerCase().indexOf(needle) !== -1 ||
           s.brand.toLowerCase().indexOf(needle) !== -1;
  });
  return byText.length ? centroidOf(byText) : null;
}

document.getElementById('manualLocateBtn').addEventListener('click', function() {
  var city = document.getElementById('manualCity').value.trim();
  if (!city) return;
  var prompt = document.getElementById('locatePrompt');
  if (prompt) prompt.innerHTML = '<div style="padding:24px 0;font-size:15px">מאתר...</div>';
  var loc = resolveLocally(city);
  if (loc) {
    userLat = loc[0];
    userLon = loc[1];
    render();
  } else {
    showError('לא נמצאה כתובת');
  }
});

document.getElementById('manualCity').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('manualLocateBtn').click();
});

// Locate button (GPS)
document.getElementById('locateBtn').addEventListener('click', function() {
  var prompt = document.getElementById('locatePrompt');
  if (prompt) prompt.innerHTML = '<div style="padding:24px 0;font-size:15px">מאתר את מיקומך...</div>';

  if (!navigator.geolocation) {
    showError('הדפדפן לא תומך בשירותי מיקום');
    render();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      render();
    },
    function(err) {
      if (err.code === 1) {
        showError('לא ניתנה הרשאת מיקום — הזן עיר או כתובת');
      } else {
        showError('לא ניתן לאתר מיקום — הזן עיר או כתובת');
      }
      render();
    },
    { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
  );
});

// Close the price / Shabbat tooltips on an outside click; keyboard users toggle with Enter/Space.
document.addEventListener('click', function() {
  document.querySelectorAll('.price-bubble.open').forEach(function(b) { b.classList.remove('open'); });
  document.querySelectorAll('.shabbat-flag.open').forEach(function(b) { b.classList.remove('open'); });
});
document.addEventListener('keydown', function(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList &&
      e.target.classList.contains('price-bubble')) {
    e.preventDefault();
    togglePriceTip(e, e.target);
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList &&
      e.target.classList.contains('shabbat-flag')) {
    e.preventDefault();
    toggleShabbatTip(e, e.target);
  }
});
