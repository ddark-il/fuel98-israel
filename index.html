<script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let stations = [];
let flagged = new Map();   // "brand|name" -> Ministry substandard-fuel info
let userLat = null, userLon = null;
let currentView = 'table';
let currentBrand = 'all';
let map = null, markers = [], userMarker = null;

// Remap brand names for display
function displayBrand(brand) {
  if (brand === 'דורלון') return 'דור אלון';
  return brand;
}

function brandClass(brand) {
  if (brand === 'דורלון') return 'דור-אלון';
  return brand;
}

// Fuel-quality flag — stations on the Ministry of Energy substandard-fuel list
function flagBadge(s) {
  const v = flagged.get(s.brand + '|' + s.name);
  if (!v) return '';
  const t = 'דווח על דלק לא תקני (' + v.fuelType + ') — נדגם ' + v.samplingDate + ' · משרד האנרגיה';
  return '<span class="fuel-flag" title="' + t + '">⚠️</span> ';
}

// Load all brand files (via manifest) + the fuel-quality violation flags
Promise.all([
  fetch('data/manifest.json')
    .then(function(r) { return r.json(); })
    .then(function(manifest) {
      return Promise.all(manifest.files.map(function(f) {
        return fetch('data/' + f).then(function(r) { return r.json(); });
      }));
    })
    .then(function(arrays) { return [].concat.apply([], arrays); }),
  fetch('data/violations.json').then(function(r) { return r.json(); }).catch(function() { return []; })
]).then(function(res) {
  stations = res[0].filter(function(s) { return s.coordinates; });
  res[1].forEach(function(v) { flagged.set(v.brand + '|' + v.name, v); });
  buildCityIndex();
  // honor a ?q= search term (shareable search links + JSON-LD SearchAction)
  var q = new URLSearchParams(location.search).get('q');
  if (q) { document.getElementById('searchInput').value = q; render(); }
});

// requestLocation is handled inline in the locate button click handler
// to ensure Safari iOS recognizes the user gesture context

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-popup';
  div.innerHTML = `<span class="close-btn" onclick="this.parentElement.remove()">&#10005;</span><span>${msg}</span>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 6000);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// City lookup for search — the city isn't in the station data, it lives only in
// the <noscript> SEO block: <h3>תחנות דלק 98 ב{city}</h3><ul><li>{brand} — {name}</li>…
var cityByKey = {};
function buildCityIndex() {
  var ns = document.querySelector('noscript');
  if (!ns) return;
  var doc = new DOMParser().parseFromString(ns.textContent, 'text/html');
  var pfx = 'תחנות דלק 98 ב';
  doc.querySelectorAll('h3').forEach(function(h3) {
    var t = (h3.textContent || '').trim();
    if (t.indexOf(pfx) !== 0) return;            // skip the "נוספות" (no-city) section
    var city = t.slice(pfx.length);
    var ul = h3.nextElementSibling;
    if (!ul || ul.tagName !== 'UL') return;
    ul.querySelectorAll('li').forEach(function(li) {
      cityByKey[(li.textContent || '').trim()] = city;
    });
  });
}

function getFiltered() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = [...stations];
  if (currentBrand !== 'all') list = list.filter(s => s.brand === currentBrand);
  if (query) list = list.filter(s =>
    s.name.toLowerCase().includes(query) ||
    displayBrand(s.brand).toLowerCase().includes(query) ||
    s.brand.toLowerCase().includes(query) ||
    (cityByKey[displayBrand(s.brand) + ' — ' + s.name] || '').toLowerCase().includes(query)
  );
  if (userLat !== null) {
    list.forEach(s => { s._dist = haversine(userLat, userLon, s.coordinates.lat, s.coordinates.lon); });
    list.sort((a, b) => a._dist - b._dist);
  }
  return list;
}

function formatDist(km) {
  if (km < 1) return `${Math.round(km * 1000)} מ'`;
  return `${km.toFixed(1)} ק"מ`;
}

function wazeUrl(lat, lon) {
  return `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;
}

function render() {
  const list = getFiltered();
  if (currentView === 'table') renderTable(list);
  if (currentView === 'map') renderMap(list);
}

function renderTable(list) {
  const shown = list.slice(0, userLat !== null ? 10 : list.length);
  const container = document.getElementById('tableView');

  if (shown.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#128531;</div>לא נמצאו תחנות</div>';
    return;
  }

  // Mobile cards
  let cards = '';
  shown.forEach((s, i) => {
    const brand = displayBrand(s.brand);
    cards += `
    <div class="station-card">
      <div class="station-rank">${i + 1}</div>
      <div class="station-info">
        <div class="station-name">${flagBadge(s)}${s.name}</div>
        <div class="station-meta">
          <span class="brand-tag brand-${brandClass(s.brand)}">${brand}</span>
          ${s._dist != null ? `<span class="distance">${formatDist(s._dist)}</span>` : ''}
        </div>
      </div>
      <a class="waze-btn" href="${wazeUrl(s.coordinates.lat, s.coordinates.lon)}" target="_blank" title="נווט ב-Waze"><img src="${WAZE_ICON_WHITE}" alt="Waze"></a>
    </div>`;
  });

  // Desktop table
  let table = `<table class="station-table">
    <thead><tr>
      <th>#</th><th>תחנה</th><th>חברה</th>
      ${userLat !== null ? '<th>מרחק</th>' : ''}
      <th>ניווט</th>
    </tr></thead><tbody>`;
  shown.forEach((s, i) => {
    const brand = displayBrand(s.brand);
    table += `<tr>
      <td>${i + 1}</td>
      <td>${flagBadge(s)}${s.name}</td>
      <td><span class="brand-tag brand-${brandClass(s.brand)}">${brand}</span></td>
      ${userLat !== null ? `<td class="distance">${formatDist(s._dist)}</td>` : ''}
      <td><a class="waze-link" href="${wazeUrl(s.coordinates.lat, s.coordinates.lon)}" target="_blank"><img src="${WAZE_ICON_BLUE}" alt="Waze"> Waze</a></td>
    </tr>`;
  });
  table += '</tbody></table>';

  container.innerHTML = cards + table;
}

// Map
const brandColors = {
  'פז': '#f9a825', 'דורלון': '#2e7d32', 'סונול': '#d32f2f', 'מיקה': '#d500f9',
  'דלק': '#1565c0', 'תפוז': '#ef6c00', 'אחר': '#616161'
};

function renderMap(list) {
  const mapEl = document.getElementById('map');
  mapEl.style.display = 'block';
  document.getElementById('tableView').style.display = 'none';

  if (!map) {
    const center = userLat !== null ? [userLat, userLon] : [31.8, 34.8];
    map = L.map('map', { zoomControl: false }).setView(center, userLat !== null ? 12 : 8);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    if (userLat !== null) {
      const arrowIcon = L.divIcon({
        className: '',
        html: `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15" fill="rgba(66,133,244,.15)" stroke="rgba(66,133,244,.3)" stroke-width="1"/>
          <path d="M16 6 L22 22 L16 18 L10 22 Z" fill="#4285f4" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });
      userMarker = L.marker([userLat, userLon], { icon: arrowIcon, zIndexOffset: 1000 })
        .addTo(map).bindPopup('המיקום שלך');
    }
  }

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  list.forEach(s => {
    const color = brandColors[s.brand] || '#666';
    const brand = displayBrand(s.brand);
    const marker = L.circleMarker([s.coordinates.lat, s.coordinates.lon], {
      radius: 8, fillColor: color, fillOpacity: .9, color: '#fff', weight: 2
    }).addTo(map);

    const distStr = s._dist ? `<br><span style="color:#888">${formatDist(s._dist)}</span>` : '';
    marker.bindPopup(`
      <div style="text-align:right;font-size:14px;min-width:140px">
        <b>${flagBadge(s)}${s.name}</b><br>
        <span class="brand-tag brand-${brandClass(s.brand)}" style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;margin:4px 0">${brand}</span>
        ${distStr}
        <br><a href="${wazeUrl(s.coordinates.lat, s.coordinates.lon)}" target="_blank"
          style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:6px 14px;background:#1a1a2e;color:#fff;border-radius:6px;text-decoration:none;font-size:13px">
          <img src="${WAZE_ICON_WHITE}" width="16" height="16" alt=""> נווט ב-Waze</a>
      </div>
    `);
    markers.push(marker);
  });

  if (userLat !== null) {
    map.setView([userLat, userLon], 13);
  } else if (markers.length > 0) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.1));
  }

  setTimeout(() => map.invalidateSize(), 100);
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    if (currentView === 'table') {
      document.getElementById('map').style.display = 'none';
      document.getElementById('tableView').style.display = 'block';
    }
    render();
  });
});

// Brand filters
document.querySelectorAll('.brand-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBrand = btn.dataset.brand;
    render();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', () => render());

// Manual city/address locate
document.getElementById('manualLocateBtn').addEventListener('click', function() {
  var city = document.getElementById('manualCity').value.trim();
  if (!city) return;
  var prompt = document.getElementById('locatePrompt');
  if (prompt) prompt.innerHTML = '<div style="padding:24px 0;font-size:15px">מחפש...</div>';
  fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(city + ', Israel') + '&format=json&limit=1&countrycodes=il')
    .then(function(r) { return r.json(); })
    .then(function(results) {
      if (results.length > 0) {
        userLat = parseFloat(results[0].lat);
        userLon = parseFloat(results[0].lon);
        render();
      } else {
        showError('לא נמצאה כתובת');
      }
    })
    .catch(function() { showError('שגיאה בחיפוש כתובת'); });
});

document.getElementById('manualCity').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('manualLocateBtn').click();
});

// Locate button (GPS)
document.getElementById('locateBtn').addEventListener('click', function() {
  var prompt = document.getElementById('locatePrompt');
  if (prompt) prompt.innerHTML = '<div style="padding:24px 0;font-size:15px">מאתר את מיקומך...</div>';

  if (!navigator.geolocation) {
    showError('הדפדפן לא תומך בשירותי מיקום');
    render();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      render();
    },
    function(err) {
      if (err.code === 1) {
        showError('לא ניתנה הרשאת מיקום — הזן עיר או כתובת');
      } else {
        showError('לא ניתן לאתר מיקום — הזן עיר או כתובת');
      }
      render();
    },
    { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
  );
});
</script>
